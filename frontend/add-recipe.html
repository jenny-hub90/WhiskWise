<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a Recipe</title>
<link rel="stylesheet" href="css/recipe.css" />
<link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <nav class="site-nav">
      <a class="brand" href="home.html">🍳 WhiskWise</a>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="add-recipe.html">Add Recipe</a>
        <a href="recipes.html">View Recipes</a>
        <a href="#" id="logoutLink">Log out</a>
      </div>
    </nav>

    <div class="card">
      <h1>Add a recipe</h1>
      <p class="subtext">Fill in the details below — ingredients and steps go one per line.</p>

      <form id="recipeForm" novalidate>
        <div class="field">
          <label for="name">Recipe name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Momo with tomato achar" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Dessert">Dessert</option>
              <option value="Snack">Snack</option>
              <option value="Beverage">Beverage</option>
            </select>
          </div>
          <div class="field">
            <label for="prepTime">Prep time (minutes)</label>
            <input type="number" id="prepTime" name="prepTime" min="0" placeholder="e.g. 30" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="servings">Servings</label>
            <input type="number" id="servings" name="servings" min="1" placeholder="e.g. 4" />
          </div>
          <div class="field">
            <label for="imageUrl">Image URL (optional)</label>
            <input type="url" id="imageUrl" name="imageUrl" placeholder="https://…" />
          </div>
        </div>

        <div class="field">
          <label for="ingredients">Ingredients</label>
          <textarea id="ingredients" name="ingredients" placeholder="One ingredient per line, e.g.&#10;2 cups flour&#10;1 tsp salt&#10;1/2 cup water"></textarea>
          <p class="hint">One ingredient per line.</p>
        </div>

        <div class="field">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" name="instructions" placeholder="One step per line, e.g.&#10;Mix flour and salt&#10;Knead into a dough&#10;Rest for 20 minutes"></textarea>
          <p class="hint">One step per line — numbered automatically.</p>
        </div>

        <button type="submit" class="primary">Save recipe</button>
        <p id="message"></p>
      </form>
    </div>
  </div>
   <footer class="site-footer">
      <p>
        &copy; <span id="year"></span> Recipe Book. Built for keeping your own
        recipes in one place.
      </p>
    </footer>

  <script src="js/add-recipe.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
